<style>
:root{color-scheme:dark;--g:#3ddc6b;--b:#4fa8ff;--y:#f2c230;--r:#ee4b3d;--w:#f4f4f0;--ink:#ecebe6;--dim:#a3a39b;--pn:rgba(28,29,34,.9);--ln:rgba(255,255,255,.12)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font:14px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
html:lang(ja) body{font-family:"Segoe UI","Yu Gothic UI","Meiryo UI",system-ui,sans-serif}
html:lang(zh) body{font-family:"Segoe UI","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}
body.idle{cursor:none}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#v{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);object-fit:fill;background:#000;max-width:none}
#empty{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(90deg,#c0c0c0 0 14.28%,#c0c000 0 28.57%,#00c0c0 0 42.85%,#00c000 0 57.14%,#c000c0 0 71.43%,#c00000 0 85.71%,#0000c0 0);}
#empty::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.78)}
#card{position:relative;max-width:min(440px,88vw);padding:28px 30px;background:var(--pn);border:1px solid var(--ln);border-radius:14px;text-align:left}
#card h1{margin:0 0 8px;font-size:22px;font-weight:600;letter-spacing:-.01em}
#card p{margin:0 0 20px;color:var(--dim);max-width:46ch}
button,select,input{font:inherit;color:inherit}
.go{background:var(--y);color:#1b1a14;border:0;border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer}
.glass{background:var(--pn);border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#hud{position:fixed;top:14px;left:14px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
#lamps{display:flex;align-items:center;gap:2px;padding:4px 6px;border-radius:999px;pointer-events:auto;transition:opacity .35s}
#mons{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.2;transition:opacity .2s}
.lamp.on{opacity:1;box-shadow:0 0 9px var(--c)}
#ly{--c:var(--g)}#la{--c:var(--y);opacity:calc(.2 + var(--lv,0)*.8)}#lr{--c:var(--r)}
#lr.on{animation:blink 1s step-end infinite}
@keyframes blink{0%,49.9%{opacity:1;box-shadow:0 0 9px var(--c)}50%,100%{opacity:.15;box-shadow:none}}
.lb{width:26px;height:26px;padding:0;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;cursor:pointer}
.lb:hover,.lb[aria-expanded=true]{background:rgba(255,255,255,.12)}
.mw{width:236px;padding:8px 10px 10px 14px;border-radius:14px;pointer-events:auto;transition:opacity .35s}
.mw.wide{width:300px}
.mw header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.mw h3{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ib.sm{width:26px;height:26px}.ib.sm svg{width:14px;height:14px}
.mw footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:8px;border-top:1px solid var(--ln)}
.mw.wide footer{justify-content:flex-end}
.vb{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding-right:4px}
#vr{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
#vf{color:var(--dim);font-variant-numeric:tabular-nums}
.cap{margin-top:4px;color:var(--dim);font-size:12px}.cap:empty{display:none}
#vu{display:flex;gap:3px;padding:4px 4px 0 0}
#vu i{flex:1;height:14px;border-radius:3px;background:rgba(255,255,255,.12)}
#vu i.on{background:var(--b);box-shadow:0 0 7px rgba(79,168,255,.5)}
#nl{list-style:none;margin:0;padding:0 4px 0 0;max-height:170px;overflow:auto;display:grid;gap:7px;font-size:12.5px;line-height:1.35}
#nl li{display:grid;grid-template-columns:auto 1fr;gap:8px}
#nl time{color:var(--dim);font-variant-numeric:tabular-nums}
#nl li.w time{color:var(--r)}
.tb{padding:4px 12px;background:#25272d;border:1px solid var(--ln);border-radius:8px;cursor:pointer;font-size:12px}
.tb:disabled{opacity:.4;cursor:default}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--dim);font-size:12px}
.sw input{appearance:none;-webkit-appearance:none;width:28px;height:16px;margin:0;border-radius:999px;background:#25272d;border:1px solid var(--ln);position:relative;cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.sw input:checked{background:rgba(242,194,48,.22);border-color:var(--y)}
.sw input:checked::after{transform:translateX(12px);background:var(--y)}
#note{position:fixed;top:14px;left:50%;transform:translateX(-50%);max-width:min(560px,92vw);padding:10px 16px;border-radius:10px;border-left:3px solid var(--y);background:rgba(28,29,34,.94);box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:5}
#dock{position:fixed;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;transition:opacity .35s}
body.idle #dock,body.idle #lamps,body.idle .mw:not(.pin){opacity:0;pointer-events:none}
body[data-pos=bc] #dock{bottom:18px;left:50%;transform:translateX(-50%)}
body[data-pos=bl] #dock{bottom:18px;left:18px}
body[data-pos=br] #dock{bottom:18px;right:18px}
body[data-pos=tl] #dock{top:14px;left:14px}
body[data-pos=tr] #dock{top:14px;right:14px}
body[data-pos=off] #dock,body[data-pos=off] #lamps{display:none}
body[data-pos^=t] #hud{top:auto;bottom:14px;flex-direction:column-reverse}
body[data-pos$=r] #panel{right:auto;left:12px;transform:translateX(calc(-100% - 24px))}
body[data-pos$=r] #panel.open{transform:none}
.ib{width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;cursor:pointer}
.ib:hover,.ib[aria-expanded=true]{background:rgba(255,255,255,.12)}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.x{display:none}.muted .x{display:block}.muted .w{display:none}
#vol{width:100%;accent-color:var(--y)}
.vw{display:grid;gap:6px;width:92px}
select option{background:#25272d;color:var(--ink)}
.kr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kr button{min-width:104px;padding:6px 10px;background:#25272d;border:1px solid var(--ln);border-radius:8px;cursor:pointer}
.kr button.on{border-color:var(--y);color:var(--y)}
#kd{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(350px,92vw);padding:20px;border-radius:14px;z-index:8}
#kd h2{margin:0;font-size:16px;font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
body.idle #panel{opacity:0;pointer-events:none}
#panel{position:fixed;top:12px;right:12px;bottom:12px;width:min(330px,92vw);padding:20px;border-radius:14px;overflow:auto;transform:translateX(calc(100% + 24px));transition:transform .22s ease,opacity .35s;z-index:6}
#panel.open{transform:none}
#panel h2{margin:0;font-size:16px;font-weight:600}
.row{display:grid;gap:5px;margin-bottom:13px}
.row label{color:var(--dim);font-size:12.5px}
select{width:100%;padding:8px 10px;text-overflow:ellipsis;background:#25272d;border:1px solid var(--ln);border-radius:8px}
input[type=range]{width:100%;accent-color:var(--y)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{margin:18px 0 10px;padding-top:14px;border-top:1px solid var(--ln);font-weight:600}
.tools{display:flex;gap:8px;margin-top:6px}
.tools button{flex:1;padding:8px;background:#25272d;border:1px solid var(--ln);border-radius:8px;cursor:pointer}
.keys{margin-top:16px;color:var(--dim);font-size:12.5px;line-height:1.7}
.about{margin-top:22px;padding-top:18px;border-top:1px solid var(--ln);display:grid;justify-items:center;gap:2px;text-align:center}
.about img{width:32px;height:32px;image-rendering:pixelated;margin-bottom:8px}
.about .nm{font-size:15px;font-weight:600;letter-spacing:.14em}
.about .nm span{margin-left:6px;color:var(--dim);font-size:12.5px;font-weight:400;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.about .credit{color:var(--dim);font-size:12px;letter-spacing:.02em}
.about .links{display:flex;gap:8px;margin-top:6px;font-size:12px;color:var(--ln)}
.about a{color:var(--dim);text-decoration:none;border-bottom:1px solid transparent}
.about a:hover,.about a:focus-visible{color:var(--y);border-bottom-color:currentColor}
#zp{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:250px;padding:10px 14px;border-radius:14px}
body[data-pos=bl] #zp,body[data-pos=tl] #zp{left:0;transform:none}
body[data-pos=br] #zp,body[data-pos=tr] #zp{left:auto;right:0;transform:none}
body[data-pos^=t] #zp{bottom:auto;top:calc(100% + 10px)}
#zp input{flex:1;min-width:0;accent-color:var(--y)}
#zl{min-width:4.2ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--dim)}
.row input[type=range]{accent-color:var(--y)}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="stage"><video id="v" autoplay playsinline muted></video></main>

<section id="empty">
  <div id="card">
    <h1 id="et">Connecting…</h1>

  </div>
</section>

<div id="hud">

    <button class="lb" id="lbv" data-ar="monVideo" data-ti="video" aria-label="Video monitor" title="Video" aria-expanded="false"><i class="lamp" id="ly"></i></button>
    <button class="lb" id="lba" data-ar="monAudio" data-ti="audio" aria-label="Audio monitor" title="Audio" aria-expanded="false"><i class="lamp" id="la"></i></button>
    <button class="lb" id="lbn" data-ar="notifs" data-ti="notifs" aria-label="Notifications" title="Notifications" aria-expanded="false"><i class="lamp" id="lr"></i></button>
  </div>
  <div id="mons">
    <section class="mw glass" id="wv" hidden data-ar="monVideo" aria-label="Video monitor">
      <header><h3 data-i="video">Video</h3><button class="ib sm mx" data-k="v" data-ar="close" data-ti="close" aria-label="Close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <div class="vb"><span id="vr">—</span><span id="vf">—</span></div>

      <div id="vu" role="img" data-ar="audioLevel" aria-label="Audio level"></div>
      <div class="cap" id="as"></div>
      <footer><label class="sw" data-ti="monPinTip" title="Keeps this monitor visible on screen"><input type="checkbox" id="pa"><span data-i="monPin">Active monitor</span></label></footer>
    </section>
    <section class="mw glass wide" id="wn" hidden data-ar="notifs" aria-label="Notifications">
      <header><h3 data-i="notifs">Notifications</h3><button class="ib sm mx" data-k="n" data-ar="close" data-ti="close" aria-label="Close" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
      <ul id="nl"></ul>
      <div class="cap" id="ne" data-i="noNotifs">No notifications</div>
      <footer><button class="tb" id="nc" data-i="clear" disabled>Clear</button></footer>
    </section>
  </div>
</div>
<div id="note" hidden role="status"></div>

<nav id="dock" class="glass">

  <button class="ib" id="bm" aria-label="Silenciar (M)" title="Silenciar (M)"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4z"/><path class="w" d="M16.5 9a4 4 0 010 6"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg></button>

  <button class="ib" id="bt" aria-label="Traducir captura (T)" title="Traducir captura (T)"><svg viewBox="0 0 24 24"><path d="M4 6h8M8 4v2M6 6c0 3 2 5 5 6M11 6c0 3-3 6-6 7"/><path d="M13 20l4-9 4 9M14.5 17h5"/></svg></button>

  <button class="ib" id="bi" aria-label="Ventana flotante (P)" title="Ventana flotante (P)"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="12" width="7" height="5" rx="1"/></svg></button>

  <div class="tools"><button id="rs" data-i="resetImg">Reset image</button><button id="rc" data-i="reconnect">Reconnect</button></div>

<script>
const $=i=>document.getElementById(i),v=$('v');

}

async function openAudio(){
  if(!stream||!P.ain)return;
  let a=null;
  try{a=(await navigator.mediaDevices.getUserMedia({audio:{deviceId:{exact:P.ain},echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:{ideal:2}}})).getAudioTracks()[0]}
  catch(e){W.audio=audioMsg(e);note()}
  if(!a)return;
  if(!stream)return a.stop();
  stream.getAudioTracks().forEach(t=>{t.onended=null;t.stop();stream.removeTrack(t)});
  teardownAudio();delete W.audio;stream.addTrack(a);wireAudio();note()
}
function teardownAudio(){
  if(ac){ac.onstatechange=null;ac.close().catch(()=>{});ac=null}
  if(sinkEl){sinkEl.srcObject=null;sinkEl=null}
  gain=an=atrack=null;delete W.ctx;delete W.sink;delete W.quiet;$('la').style.setProperty('--lv',0)
}
async function settle(){
  await refresh();
  const cur=(k,id)=>devs.find(d=>d.kind===k&&d.deviceId===id);
  const vt=stream&&stream.getVideoTracks()[0],at=stream&&stream.getAudioTracks()[0];
  const cv=vt&&cur('videoinput',vt.getSettings().deviceId);
  if(cv&&P.vid&&cv.deviceId!==P.vid&&hops++<2)return open();
  const ca=at&&cur('audioinput',at.getSettings().deviceId),wa=cur('audioinput',P.ain);
  if(ca&&wa&&ca.groupId!==wa.groupId&&hops++<2)return openAudio();
  volume()
}
async function connect(){
  if(!navigator.mediaDevices)return showCard(true,'noBrT','noBrM',true);
  hops=0;
  try{await refresh()}catch(e){return fail(e)}
  if(!devs.some(d=>d.kind==='videoinput'))return fail({name:'NotFoundError'});
  if(devs.some(d=>d.kind==='videoinput'&&!d.deviceId))P.vid=''
  open()
}

function wireAudio(){
  const at=stream.getAudioTracks()[0];if(!at)return;
  at.onended=()=>{W.audio='audioLost';note()};
  try{
    const sr=at.getSettings().sampleRate;
    try{ac=new AudioContext({latencyHint:'interactive',sampleRate:sr})}catch{ac=new AudioContext({latencyHint:'interactive'})}
    const src=ac.createMediaStreamSource(new MediaStream([at]));
    gain=ac.createGain();an=ac.createAnalyser();an.fftSize=1024;
    src.connect(gain);src.connect(an);
    if(ac.setSinkId||!HTMLMediaElement.prototype.setSinkId)gain.connect(ac.destination);
    else{const d=ac.createMediaStreamDestination();gain.connect(d);sinkEl=new Audio();sinkEl.srcObject=d.stream;sinkEl.play().catch(()=>{})}
  }catch(e){teardownAudio();W.audio=mk('audioFail',e.message||e.name);return}
  atrack=at;
  const st=()=>{if(!ac)return;ac.state==='running'?delete W.ctx:W.ctx='ctx';note()};
  ac.onstatechange=st;ac.resume().catch(()=>{});st();
  sink();volume()
}
function sink(){
  const bad=()=>{W.sink='sinkBad';note()};
  delete W.sink;
  if(ac&&ac.setSinkId)ac.setSinkId(P.aout).catch(bad);
  else if(sinkEl&&sinkEl.setSinkId)sinkEl.setSinkId(P.aout).catch(bad)
}
function volume(){if(gain)gain.gain.value=P.mute?0:P.vol;if(stream&&!atrack&&!W.audio)W.pick='pick';else delete W.pick;note();$('bm').classList.toggle('muted',P.mute);$('vol').value=P.vol}
const toggleMute=()=>{save('mute',!P.mute);volume()};

function layout(){
  const w=v.videoWidth,h=v.videoHeight;if(!w||!innerWidth||!innerHeight)return;
  v.style.imageRendering=P.scl==='smooth'?'auto':'pixelated';
  const z=P.zoom/100;
  if(P.asp==='fill'){v.style.width=100*z+'vw';v.style.height=100*z+'vh';return}
  const ar=P.asp==='43'?4/3:P.asp==='169'?16/9:((w===720||w===704)&&h<=576?4/3:w/h);
  const bw=h*ar;let s=Math.min(innerWidth/bw,innerHeight/h)*z;
  if(P.scl==='int'&&s>=1)s=Math.floor(s);
  v.style.width=bw*s+'px';v.style.height=h*s+'px'
}
function tone(){v.style.filter='brightness('+P.br+'%) contrast('+P.co+'%) saturate('+P.sa+'%)'}
function setZoom(x){
  x=Math.max(25,Math.min(200,Number(x)||100));
  save('zoom',x);
  $('zm').value=x;$('zs').value=x;$('zl').textContent=x+'%';$('zv').textContent=x+'%';
  layout()
}
function toggleZoom(o){
  const p=$('zp');o=o===undefined?p.hidden:o;
  p.hidden=!o;$('bz').setAttribute('aria-expanded',o);wake()
}

function shot(){
  if(!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  const x=c.getContext('2d');x.filter=v.style.filter;x.drawImage(v,0,0);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='capture-'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)});
  W.toast='shotOk';note();setTimeout(()=>{delete W.toast;note()},1800)
}
let tw=null;
async function trad(){
  if(!v.videoWidth)return;
  const k=Math.max(1,Math.min(4,Math.floor(2160/v.videoWidth))),c=document.createElement('canvas');
  c.width=v.videoWidth*k;c.height=v.videoHeight*k;
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(v,0,0,c.width,c.height);
  let ok=false;
  try{const b=await new Promise(r=>c.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);ok=true}catch{}
  W.toast=ok?'tradOk':'tradFail';note();
  setTimeout(()=>{delete W.toast;note()},3500);
  if(!ok)return;
  if(document.fullscreenElement){await document.exitFullscreen().catch(()=>{});await new Promise(r=>setTimeout(r,350))}
  const u='https://translate.google.com/?sl=ja&tl='+TL[P.lang]+'&op=images';
  if(tw&&!tw.closed){tw.location.href=u;tw.focus()}else tw=window.open(u,'traductor-av','popup,width=1000,height=760');
  if(!tw){W.toast='popupBlocked';note()}
}
function revive(){
  if(!stream)return;
  layout();
  if(v.paused)v.play().catch(()=>{});
  const t=lastFrame;
  setTimeout(()=>{if(stream&&lastFrame===t){v.srcObject=null;v.srcObject=stream;v.play().catch(()=>{})}},1500)
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)revive()});
document.addEventListener('fullscreenchange',()=>setTimeout(revive,200));
addEventListener('focus',()=>setTimeout(revive,200));
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});
const pip=()=>document.pictureInPictureElement?document.exitPictureInPicture():v.videoWidth&&v.requestPictureInPicture().catch(()=>{});
function togglePanel(o){const p=$('panel');o=o===undefined?!p.classList.contains('open'):o;p.classList.toggle('open',o);p.inert=!o;$('bs').setAttribute('aria-expanded',o);wake()}
function wake(){document.body.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>{const p=$('panel');if(!$('dock').matches(':hover')&&!p.matches(':hover')&&!p.contains(document.activeElement)&&!$('zp').contains(document.activeElement)&&!$('hud').matches(':hover')&&!$('hud').contains(document.activeElement)){document.body.classList.add('idle');$('zp').hidden=true;$('bz').setAttribute('aria-expanded','false')}},1200)}

if('requestVideoFrameCallback' in v){const tick=()=>{frames++;lastFrame=performance.now();v.requestVideoFrameCallback(tick)};v.requestVideoFrameCallback(tick)}
else v.addEventListener('timeupdate',()=>{frames++;lastFrame=performance.now()});

const cv=document.createElement('canvas');cv.width=16;cv.height=12;
const cx=cv.getContext('2d',{willReadFrequently:true});
setInterval(()=>{
  const fps=frames;frames=0;
  if(!stream)return;
  const stale=performance.now()-lastFrame>3000;
  if(stale&&P.chk)W.stale='stale';else delete W.stale;
  lamp('y',!stale);
  if(!stale&&v.videoWidth){try{cx.drawImage(v,0,0,16,12);const d=cx.getImageData(0,0,16,12).data;let s=0;for(let i=0;i<d.length;i+=4)s+=d[i]*.3+d[i+1]*.59+d[i+2]*.11;black=s/192<4?black+1:0}catch{}}
  if(black>=5&&P.chk)W.black='black';else delete W.black;
  const rz=v.videoWidth?v.videoWidth+'×'+v.videoHeight:'—';
  if(stale)setVid(rz,'—','vsNoImg');else if(v.videoWidth)setVid(rz,fps+' fps','');else setVid('—','—','vsConn');
  note()
},1000);
const fb=new Float32Array(1024),vu=$('vu'),NS=16,VL=-50,VH=-1;
let lvDb=-99,pkDb=-99,pkT=0,lastT=0,lastN=-1,lastK=-1,lastCap=null;
for(let i=0;i<NS;i++)vu.append(document.createElement('i'));
const segs=[...vu.children];
const seg=db=>Math.max(0,Math.min(NS,Math.ceil((db-VL)/(VH-VL)*NS)));
function meter(t){
  requestAnimationFrame(meter);
  const dt=Math.min(.1,(t-lastT)/1000)||.016;lastT=t;
  let m=0;
  if(an){an.getFloatTimeDomainData(fb);for(let i=0;i<fb.length;i++){const a=Math.abs(fb[i]);if(a>m)m=a}}
  peak=Math.max(peak,m);
  const db=m>0?20*Math.log10(m):-99;
  lvDb=db>lvDb?db:Math.max(db,lvDb-70*dt);
  if(lvDb>=pkDb){pkDb=lvDb;pkT=t}else if(t-pkT>600)pkDb=Math.max(lvDb,pkDb-30*dt);
  $('la').style.setProperty('--lv',Math.min(1,Math.max(0,(lvDb-VL)/-VL)));
  const cap=atrack?'':'noAudioIn';
  if(cap!==lastCap){$('as').textContent=tr(cap);lastCap=cap}
  if(!$('wa').hidden){
    const n=seg(lvDb),k=pkDb>VL?seg(pkDb)-1:-1;
    if(n!==lastN||k!==lastK){segs.forEach((e,i)=>e.classList.toggle('on',i<n||i===k));lastN=n;lastK=k}
  }
}
requestAnimationFrame(meter);

/* ---- monitores (ventanas de las luces) ---- */
const NL=[],LG={},MK={v:'mv',a:'ma'};let LC='';
function setVid(r,f,s){VS=[r,f,s];$('vr').textContent=r;$('vf').textContent=f;$('vs').textContent=tr(s)}
function logN(t,info){NL.unshift({d:new Date(),x:t,i:!!info});if(NL.length>60)NL.length=60;drawN()}
function drawN(){
  const l=$('nl');l.innerHTML='';
  NL.forEach(n=>{
    const li=document.createElement('li'),tm=document.createElement('time'),sp=document.createElement('span');
    tm.textContent=n.d.toLocaleTimeString(LOC[P.lang],{hour12:false});sp.textContent=tr(n.x);
    if(!n.i)li.className='w';
    li.append(tm,sp);l.append(li)
  });
  $('ne').hidden=NL.length>0;$('nc').disabled=!NL.length
}
function syncMon(k){if(!MK[k])return;$('p'+k).checked=!!P[MK[k]];$('w'+k).classList.toggle('pin',!!P[MK[k]])}
function mon(k,o){
  const w=$('w'+k);o=o===undefined?w.hidden:o;
  if(!o&&MK[k]&&P[MK[k]])save(MK[k],false);
  w.hidden=!o;$('lb'+k).setAttribute('aria-expanded',o);
  syncMon(k);wake()
}
function closeMons(){['v','a','n'].forEach(k=>{if(!$('w'+k).hidden&&!(MK[k]&&P[MK[k]]))mon(k,false)})}
['v','a','n'].forEach(k=>{$('lb'+k).onclick=()=>mon(k)});
document.querySelectorAll('.mx').forEach(b=>{b.onclick=()=>mon(b.dataset.k,false)});
['v','a'].forEach(k=>{$('p'+k).onchange=e=>{save(MK[k],e.target.checked);syncMon(k);e.target.blur()}});
$('nc').onclick=()=>{NL.length=0;drawN()};
function initMons(){drawN();['v','a'].forEach(k=>{syncMon(k);if(P[MK[k]])mon(k,true)})}
setInterval(()=>{
  if(!atrack||!ac){quiet=0;peak=0;delete W.quiet;return}
  quiet=ac.state==='running'&&!document.hidden&&peak<.004?quiet+1:0;peak=0;
  if(quiet>=6&&P.chk)W.quiet='quiet';else delete W.quiet;
  note()
},1000);

const binds=[['sv','vid',open,'vl'],['sa','ain',openAudio,'al'],['so','aout',sink,'ol'],['sr','res',open],['sf','fps',open],['sp','asp',layout],['ss','scl',layout],['sd','pos',()=>{document.body.dataset.pos=P.pos}]];
binds.forEach(([id,k,fn,lk])=>{const el=$(id);if(!['sv','sa','so'].includes(id))el.value=P[k];el.onchange=()=>{save(k,el.value);if(lk)save(lk,el.value?el.selectedOptions[0].text:'');el.title=el.selectedOptions[0].text;fn();el.blur()}});
[['gb','br'],['gc','co'],['gs','sa']].forEach(([id,k])=>{const el=$(id);el.value=P[k];el.oninput=()=>{save(k,Number(el.value));tone()};el.onchange=()=>el.blur();el.ondblclick=()=>{save(k,100);el.value=100;tone()}});
['zm','zs'].forEach(id=>{const el=$(id);el.oninput=()=>setZoom(el.value);el.onchange=()=>el.blur();el.ondblclick=()=>setZoom(100)});
$('bz').onclick=()=>toggleZoom();
addEventListener('pointerdown',e=>{if(!$('zp').hidden&&!e.target.closest('#dock'))toggleZoom(false)});
$('rs').onclick=()=>{['br','co','sa'].forEach(k=>save(k,100));[['gb','br'],['gc','co'],['gs','sa']].forEach(([i,k])=>$(i).value=P[k]);tone()};
function chk(){const b=$('ck');b.textContent=P.chk?t('on'):t('off');b.className=P.chk?'on':'';b.setAttribute('aria-pressed',P.chk)}
$('ck').onclick=()=>{save('chk',!P.chk);if(!P.chk){['stale','black','mute','quiet'].forEach(k=>delete W[k]);note()}chk()};
$('rc').onclick=connect;$('bc').onclick=connect;$('bx').onclick=()=>togglePanel(false);
$('bs').onclick=()=>togglePanel();$('bm').onclick=toggleMute;$('bp').onclick=shot;$('bt').onclick=trad;$('bf').onclick=fs;
$('bi').onclick=pip;$('bi').hidden=!document.pictureInPictureEnabled;
$('vol').oninput=e=>{save('vol',Number(e.target.value));if(P.mute)save('mute',false);volume()};
$('vol').onchange=e=>e.target.blur();
v.ondblclick=fs;v.onresize=layout;v.onloadedmetadata=layout;addEventListener('resize',layout);
['pointermove','pointerdown','keydown'].forEach(e=>addEventListener(e,wake));
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{if(ac&&ac.state!=='running')ac.resume().catch(()=>{})}));
const ACT=[['fs','fullscreen'],['mute','muteA'],['shot','shot'],['trad','trad'],['pip','pip'],['zoom','zoom'],['panel','settings']];
const RUN={fs,mute:()=>toggleMute(),shot,trad,pip,zoom:()=>P.pos==='off'?togglePanel(true):toggleZoom(),panel:()=>togglePanel()};
const kname=k=>k===' '?t('space'):k.length===1?k.toUpperCase():k;
let rebind=null;
function titles(){[['bf','fs','fullscreen'],['bm','mute','mute'],['bp','shot','shot'],['bt','trad','trad'],['bi','pip','pip'],['bz','zoom','zoom'],['bs','panel','settings']].forEach(([i,a,tk])=>{const e=$(i),x=t(tk)+' ('+kname(P.keys[a])+')';e.title=x;e.setAttribute('aria-label',x)})}
function drawKeys(){
  const l=$('kl');l.innerHTML='';
  ACT.forEach(([a,tt])=>{
    const r=document.createElement('div'),n=document.createElement('span'),b=document.createElement('button');
    r.className='kr';n.textContent=t(tt);
    b.textContent=rebind===a?t('pressKey'):kname(P.keys[a]);b.className=rebind===a?'on':'';
    b.onclick=()=>{rebind=rebind===a?null:a;drawKeys()};
    r.append(n,b);l.append(r)
  });
  titles()
}
function toggleKeys(o){$('kd').hidden=!o;rebind=null;if(o)drawKeys()}
$('bk').onclick=()=>toggleKeys(true);$('kx').onclick=()=>toggleKeys(false);
$('kr').onclick=()=>{P.keys=Object.assign({},DK);K.set('keys',P.keys);rebind=null;drawKeys()};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(rebind){
    e.preventDefault();
    if(['shift','control','alt','meta','dead'].includes(k))return;
    if(k!=='escape'){const o=Object.keys(P.keys).find(x=>P.keys[x]===k),old=P.keys[rebind];if(o&&o!==rebind)P.keys[o]=old;P.keys[rebind]=k;K.set('keys',P.keys)}
    rebind=null;drawKeys();return
  }
  if(e.ctrlKey||e.metaKey||e.altKey||e.target.matches('select'))return;
  if(k==='escape'){if(!$('kd').hidden)toggleKeys(false);else if(!$('zp').hidden)toggleZoom(false);else if($('panel').classList.contains('open'))togglePanel(false);else closeMons();return}
  const a=Object.keys(P.keys).find(x=>P.keys[x]===k);if(a)RUN[a]()
});
if(navigator.mediaDevices)navigator.mediaDevices.addEventListener('devicechange',async()=>{try{await refresh();if(lost&&!busy&&devs.some(d=>d.kind==='videoinput'&&d.deviceId===P.vid))open()}catch{}});
function applyLang(init){
  document.documentElement.lang=HL[P.lang];
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ti]').forEach(e=>e.title=t(e.dataset.ti));
  document.querySelectorAll('[data-ar]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ar)));
  $('sl').value=P.lang;
  titles();chk();drawCard();drawN();setVid(...VS);lastCap=null;
  if(!$('kd').hidden)drawKeys();
  if(!init){note();refresh().catch(()=>{})}
}
$('sl').onchange=e=>{save('lang',e.target.value);applyLang();e.target.blur()};
document.body.dataset.pos=P.pos;applyLang(true);$('panel').inert=true;tone();setZoom(P.zoom);initMons();volume();wake();connect();
</script>
</body>
